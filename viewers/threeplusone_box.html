<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3+1 comoving box — braided universe viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

    #stage { position: fixed; inset: 0; }

        background: rgba(10, 12, 20, 0.9);
        border-bottom: 1px solid #232a3a;
    }
    #topbar .sep { width: 1px; align-self: stretch; background: #232a3a; }
    button, select, input[type=number] {
        background: #151a28; color: #cfd6e4;
        border: 1px solid #2c3550; border-radius: 5px;
        padding: 4px 9px; font: inherit; cursor: pointer;
    }
    button:hover { border-color: #4a5a8a; }
    button.on { background: #26304d; border-color: #5a6fae; }
    label { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
    input[type=range] { width: 100px; }
    #timeScrub { width: 220px; }
    input[type=number] { width: 64px; padding: 3px 6px; }
    #status { margin-left: auto; color: #e8b04a; font-size: 12px; max-width: 46ch; }
    /* ---- sliding settings panel ---- */
    #sidepanel {
        position: fixed; top: 0; bottom: 0; left: 0; z-index: 15;
        width: 280px; box-sizing: border-box;
        padding: 60px 14px 20px; overflow-y: auto;

<!-- Three.js classic UMD builds — load from file:// without CORS issues -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
'use strict';
/* 3+1 comoving box viewer ("box3d").
 *
 * Renders the (X, Y, W) comoving slice of a 3+1 packing as points inside the
 * period-2 box [-1,1)^3, scrubbed over conformal time z in (0, pi), plus an
 * all-times worldline cloud. Packings come from the in-page two-phase RSA
 * generator (uniques then subpaths, the 2+1 wrapped viewer's packer with a
 * third axis), from a CUDA --dump-params CSV, or from the bundled example.
 *
 * Worldline model (one axis shown; y and w identical in form):
 *     x(z) = ax2*sin(z) + sum_j ax_j*(sin(bx_j*z + fx_j) - sin(fx_j))
 * Comoving X = x(z)/sin(z); the engine z grid is T interior points of (0, pi).
 *
 * Rendering mirrors the 2+1 wrapped viewer: instanced points, per-path
 * scalars as instanced attributes, wiggle terms in a float DataTexture at
 * THREE texels per term (one per axis), trajectories evaluated analytically
 * in the vertex shader with the term count baked in as a shader constant.
 */
const VIEWER_VERSION = 'box3d-v4';
document.getElementById('version').textContent = VIEWER_VERSION;
const statusEl = document.getElementById('status');

/* ================= worldline data + math ================= */

let functions = [];          // {ax2,ay2,aw2, terms[{ax,bx,fx,ay,by,fy,aw,bw,fw}],
                             //  fsum, pecMin, pecMax, groupID, isSub}
let Z_cache = [];
let time_steps = 40, modulation_Max = 39, freqTerms = 3;
let groupIDcount = 0, subCount = 0;
let genEpoch = 0;            // every Generate / Import bumps this; stale async work bails

function bakeZValues() {
    const step = Math.PI / (time_steps + 1);
    Z_cache = Array.from({ length: time_steps }, function (_, i) { return step + i * step; });
}

// periodic wrap to [-1,1); +1 maps to -1 (same identified point)
function wrapComov(v) { return (((v + 1) % 2) + 2) % 2 - 1; }

// Unwrapped comoving position of a path at z, all three axes.
function comovXYW(f, z) {
    const s = Math.sin(z);
    let x = f.ax2 * s, y = f.ay2 * s, w = f.aw2 * s;
    for (let j = 0; j < f.terms.length; j++) {
        const t = f.terms[j];
        x += t.ax * (Math.sin(t.bx * z + t.fx) - Math.sin(t.fx));
        y += t.ay * (Math.sin(t.by * z + t.fy) - Math.sin(t.fy));
        w += t.aw * (Math.sin(t.bw * z + t.fw) - Math.sin(t.fw));
    }
    return [x / s, y / s, w / s];
}

// Analytic d(comoving)/dz — used by the minimap's speed paint.
function comovVelXYW(f, z) {
    const s = Math.sin(z), c = Math.cos(z);
    let x = f.ax2 * s, y = f.ay2 * s, w = f.aw2 * s;
    let dx = f.ax2 * c, dy = f.ay2 * c, dw = f.aw2 * c;
    for (let j = 0; j < f.terms.length; j++) {
        const t = f.terms[j];
        x += t.ax * (Math.sin(t.bx * z + t.fx) - Math.sin(t.fx));
        y += t.ay * (Math.sin(t.by * z + t.fy) - Math.sin(t.fy));
        w += t.aw * (Math.sin(t.bw * z + t.fw) - Math.sin(t.fw));
        dx += t.ax * t.bx * Math.cos(t.bx * z + t.fx);
        dy += t.ay * t.by * Math.cos(t.by * z + t.fy);
        dw += t.aw * t.bw * Math.cos(t.bw * z + t.fw);
    }
    const s2 = s * s;
    return [(dx * s - x * c) / s2, (dy * s - y * c) / s2, (dw * s - w * c) / s2];
}

// Full trajectory over the z grid + the per-path comoving speed range.
// The range is measured on UNWRAPPED coords (differencing across a wrap
// would inject period-sized jumps); accepted paths keep the result so
// buildBuffers never rescans trajectories.
function comovingTraj(f) {
    const n = Z_cache.length;
    const X = new Float32Array(n), Y = new Float32Array(n), W = new Float32Array(n);
    let pecMin = Infinity, pecMax = -Infinity, px = 0, py = 0, pw = 0;
    // proper peculiar speed range: the comoving speed × sin z (scale factor),
    // measured in the same pass — its own range, since the sin z weighting
    // moves the extremes to different parts of the cycle
    let pecPMin = Infinity, pecPMax = -Infinity;
    for (let i = 0; i < n; i++) {
        const z = Z_cache[i];
        const p = comovXYW(f, z);
        if (i > 0) {
            const dz = z - Z_cache[i - 1];
            // Chebyshev norm — matches the packing metric (cubic cells)
            const v = Math.max(
                Math.abs(p[0] - px), Math.abs(p[1] - py), Math.abs(p[2] - pw)
            ) / dz;
            if (v < pecMin) pecMin = v;
            if (v > pecMax) pecMax = v;
            const vp = v * Math.sin((z + Z_cache[i - 1]) / 2);
            if (vp < pecPMin) pecPMin = vp;
            if (vp > pecPMax) pecPMax = vp;
        }
        px = p[0]; py = p[1]; pw = p[2];
        X[i] = wrapComov(p[0]);
        Y[i] = wrapComov(p[1]);
        W[i] = wrapComov(p[2]);
    }
    return { X: X, Y: Y, W: W, pecMin: pecMin, pecMax: pecMax,
             pecPMin: pecPMin, pecPMax: pecPMax };
}

// Frequency-paint scalar: per axis the amplitude-weighted mean wiggle
// frequency (weights |a·b|, each term's share of the unit budget), summed
// over the three axes.
function freqSum(terms) {
    let sx = 0, sy = 0, sw = 0, nx = 0, ny = 0, nw = 0;
    for (const t of terms) {
        sx += Math.abs(t.ax * t.bx) * t.bx; nx += Math.abs(t.ax * t.bx);
        sy += Math.abs(t.ay * t.by) * t.by; ny += Math.abs(t.ay * t.by);
        sw += Math.abs(t.aw * t.bw) * t.bw; nw += Math.abs(t.aw * t.bw);
    }
    return sx / (nx || 1) + sy / (ny || 1) + sw / (nw || 1);
}

/* ================= in-page two-phase 3D packer ================= */
/* The 2+1 wrapped viewer's packer with a third axis: per-time-step spatial
   hash of CELL = 2/T cubes (Map-keyed — a dense NCELL^3 array would be
   64M cells at T=400), 27-neighbour wrap scan, Chebyshev exclusion.
   Phase 1 packs uniques (any contact rejects); phase 2 packs subpaths
   (adoption: touch exactly ONE group and join it; two groups or nothing
   rejects). Jam signals: 500 consecutive failed candidates, and for subs a
   volume jam (consecutive accepts claiming zero new collision cells). */

let CELL = 1, NCELL = 1, gridByT = [], saturated = false;
let fillCells = 0, totalCells = 1;
let genBudgetMs = 6000, genStart = 0, consecFails = 0, lastLiveUpload = 0;
let genPhase = 'unique', genSubBudgetMs = 4000, subStart = 0, maxUniques = 0;
let subSaturated = false, subReason = '', consecZeroVol = 0;
let subJamFails = 500, volJamAccepts = 200, skipPhase = false, abort_gen = false;
const maxAttemptsPerFunction = 50;

const wrapCell = function (c) { return ((c % NCELL) + NCELL) % NCELL; };
function cellOf(v) { return wrapCell(Math.floor((v + 1) / CELL)); }
function cellKey(cx, cy, cw) { return (cx * NCELL + cy) * NCELL + cw; }
function resetGrid() {
    CELL = 2 / time_steps; NCELL = time_steps;
    gridByT = Array.from({ length: Z_cache.length }, function () { return new Map(); });
    fillCells = 0; totalCells = Z_cache.length * NCELL * NCELL * NCELL;
}
function fillPct() { return 100 * fillCells / totalCells; }

function collides(traj) {
    const n = Z_cache.length;
    for (let i = 0; i < n; i++) {
        const Xi = traj.X[i], Yi = traj.Y[i], Wi = traj.W[i], m = gridByT[i];
        const cx = cellOf(Xi), cy = cellOf(Yi), cw = cellOf(Wi);
        for (let dx = -1; dx <= 1; dx++)
        for (let dy = -1; dy <= 1; dy++)
        for (let dw = -1; dw <= 1; dw++) {
            const arr = m.get(cellKey(wrapCell(cx + dx), wrapCell(cy + dy), wrapCell(cw + dw)));
            if (!arr) continue;
            for (let j = 0; j < arr.length; j += 4) {
                let dX = Xi - arr[j];     if (dX > 1) dX -= 2; else if (dX < -1) dX += 2;
                let dY = Yi - arr[j + 1]; if (dY > 1) dY -= 2; else if (dY < -1) dY += 2;
                let dW = Wi - arr[j + 2]; if (dW > 1) dW -= 2; else if (dW < -1) dW += 2;
                if (Math.abs(dX) <= CELL && Math.abs(dY) <= CELL && Math.abs(dW) <= CELL)
                    return true;
            }
        }
    }
    return false;
}

// Subpath acceptance: scans EVERY contact; returns the single group joined,
// or -1 on two groups / no contact at all.
function subGroupOf(traj) {
    const n = Z_cache.length;
    let gid = -1;
    for (let i = 0; i < n; i++) {
        const Xi = traj.X[i], Yi = traj.Y[i], Wi = traj.W[i], m = gridByT[i];
        const cx = cellOf(Xi), cy = cellOf(Yi), cw = cellOf(Wi);
        for (let dx = -1; dx <= 1; dx++)
        for (let dy = -1; dy <= 1; dy++)
        for (let dw = -1; dw <= 1; dw++) {
            const arr = m.get(cellKey(wrapCell(cx + dx), wrapCell(cy + dy), wrapCell(cw + dw)));
            if (!arr) continue;
            for (let j = 0; j < arr.length; j += 4) {
                let dX = Xi - arr[j];     if (dX > 1) dX -= 2; else if (dX < -1) dX += 2;
                let dY = Yi - arr[j + 1]; if (dY > 1) dY -= 2; else if (dY < -1) dY += 2;
                let dW = Wi - arr[j + 2]; if (dW > 1) dW -= 2; else if (dW < -1) dW += 2;
                if (Math.abs(dX) <= CELL && Math.abs(dY) <= CELL && Math.abs(dW) <= CELL) {
                    const g = arr[j + 3];
                    if (gid < 0) gid = g;
                    else if (g !== gid) return -1;   // spans two groups
                }
            }
        }
    }
    return gid;                                      // -1 when it touched nothing
}

function insertTraj(traj, gid) {
    const n = Z_cache.length;
    let newCells = 0;
    for (let i = 0; i < n; i++) {
        const m = gridByT[i];
        const k = cellKey(cellOf(traj.X[i]), cellOf(traj.Y[i]), cellOf(traj.W[i]));
        let arr = m.get(k);
        if (!arr) { arr = []; m.set(k, arr); newCells++; }
        arr.push(traj.X[i], traj.Y[i], traj.W[i], gid);
    }
    fillCells += newCells;
    return newCells;
}

function drawOneFreq() { return Math.floor(Math.random() * modulation_Max) + 2; }
function drawUniqueFreqs(count) {
    const out = [];
    let guard = 0;
    while (out.length < count && guard < 400) {
        const b = drawOneFreq();
        if (out.includes(b)) { guard++; continue; }
        out.push(b);
    }
    for (let b = 2; out.length < count; b++)
        if (!out.includes(b)) out.push(b);
    return out;
}
function splitUnit(count) {
    if (count === 1) return [1];
    const cuts = Array.from({ length: count - 1 }, Math.random).sort(function (a, b) { return a - b; });
    const w = [cuts[0]];
    for (let j = 1; j < count - 1; j++) w.push(cuts[j] - cuts[j - 1]);
    w.push(1 - cuts[count - 2]);

}

function makeAxisTerms(freqs) {

    return freqs.map(function (b, j) {
        return {
            a: (Math.random() > 0.5 ? 1 : -1) * w[j] / b,
            b: b,
            f: (b % 2 === 0) ? Math.random() * Math.PI : 0,

    const terms = tx.map(function (t, j) {
        return { ax: t.a, bx: t.b, fx: t.f,
                 ay: ty[j].a, by: ty[j].b, fy: ty[j].f,
                 aw: tw[j].a, bw: tw[j].b, fw: tw[j].f };

        if (!collides(traj)) {
            insertTraj(traj, groupIDcount);
            f.pecMin = traj.pecMin; f.pecMax = traj.pecMax;
            f.pecPMin = traj.pecPMin; f.pecPMax = traj.pecPMax;
            f.groupID = groupIDcount; f.isSub = false;

        const traj = comovingTraj(f);

        if (gid >= 0) {
            f.newCells = insertTraj(traj, gid);
            f.pecMin = traj.pecMin; f.pecMax = traj.pecMax;

    let finished = false;
    while (!abort_gen && !finished && performance.now() - t0 <= 12) {   // 12 ms then yield
        if (genPhase === 'unique') {
            if (uniquePhaseOver()) {
                skipPhase = false;
                if (genSubBudgetMs > 0) {
                    genPhase = 'sub'; consecFails = 0; subStart = performance.now();
                } else finished = true;
                continue;
            }
            const nf = generateFunction();
            if (nf) { functions.push(nf); groupIDcount++; consecFails = 0; }
            else if (++consecFails > 500) saturated = true;
        } else {
            if (subSaturated || skipPhase || performance.now() - subStart >= genSubBudgetMs) {
                skipPhase = false;
                finished = true;

        if (genPhase === 'unique') {
            const secsLeft = Math.ceil((genBudgetMs - (performance.now() - genStart)) / 1000);
            statusEl.textContent = 'Generating… ' + functions.length + ' paths · fill ' +
                fillPct().toFixed(2) + '% · ' + secsLeft + 's left';
        } else {
            const secsLeft = Math.ceil((genSubBudgetMs - (performance.now() - subStart)) / 1000);
            statusEl.textContent = 'Subpaths… ' + groupIDcount + ' uniques + ' + subCount +
                ' subs · ' + secsLeft + 's left';

        if (performance.now() - lastLiveUpload > 800) {
            lastLiveUpload = performance.now();
            buildBuffers(); rebuildGPU(); hudDirty = true;
        }
        setTimeout(function () { make_groups(epoch); }, 0);
    } else {
        const notes = [];
        if (saturated) notes.push('space saturated');
        if (subReason) notes.push(subReason);
        const note = notes.length ? ' (' + notes.join(', ') + ')' : '';
        setTimeout(function () {
            if (epoch !== genEpoch) return;
            buildBuffers(); rebuildGPU();
            gridByT = [];                            // the page's only O(N·T) storage
            hudDirty = true;
            const subTxt = subCount ? groupIDcount + ' uniques + ' + subCount + ' subs'
                                    : functions.length + ' paths';
            statusEl.textContent = subTxt + note + ' · T=' + time_steps +
                ' · fill ' + fillPct().toFixed(2) + '%';

    }
}

/* ================= CSV import ================= */

function parseDumpCSV(text) {
    const lines = text.split(/\r?\n/).filter(function (ln) { return ln.trim().length > 0; });
    if (lines.length < 2) throw new Error('empty CSV');
    const cols = lines[0].split(',').map(function (c) { return c.trim(); });
    const idx = {};
    cols.forEach(function (c, i) { idx[c] = i; });

    const multiTerm = ('ax_1' in idx);
    if (multiTerm && !('aw_1' in idx)) throw new Error('2+1 dump — use the 2-torus viewer');
    if (!multiTerm && !('aw' in idx)) throw new Error('2+1 dump — use the 2-torus viewer');
    const hasGid = ('gid' in idx);

    let nw = 1;
    if (multiTerm) {
        while (('ax_' + (nw + 1)) in idx) nw += 1;
    }

    const paths = [];
    let skipped = 0;
    for (let r = 1; r < lines.length; r++) {
        const v = lines[r].split(',').map(Number);
        let p;
        if (multiTerm) {
            p = { ax2: v[idx.ax2], ay2: v[idx.ay2], aw2: v[idx.aw2], terms: [] };
            for (let j = 1; j <= nw; j++) {
                p.terms.push({
                    ax: v[idx['ax_' + j]], bx: v[idx['bx_' + j]], fx: v[idx['fx_' + j]],
                    ay: v[idx['ay_' + j]], by: v[idx['by_' + j]], fy: v[idx['fy_' + j]],
                    aw: v[idx['aw_' + j]], bw: v[idx['bw_' + j]], fw: v[idx['fw_' + j]],
                });
            }
        } else {
            p = {
                ax2: v[idx.ax2], ay2: v[idx.ay2], aw2: v[idx.aw2],
                terms: [{
                    ax: v[idx.ax], bx: v[idx.bx], fx: ('fx' in idx) ? v[idx.fx] : 0,
                    ay: v[idx.ay], by: v[idx.by], fy: ('fy' in idx) ? v[idx.fy] : 0,
                    aw: v[idx.aw], bw: v[idx.bw], fw: ('fw' in idx) ? v[idx.fw] : 0,
                }],
            };
        }
        p.gid = hasGid ? v[idx.gid] : r - 1;
        let ok = isFinite(p.ax2) && isFinite(p.ay2) && isFinite(p.aw2);
        for (let j = 0; ok && j < p.terms.length; j++) {
            const t = p.terms[j];
            ok = isFinite(t.ax) && isFinite(t.bx) && isFinite(t.ay) &&
                 isFinite(t.by) && isFinite(t.aw) && isFinite(t.bw);
        }
        if (!ok) { skipped += 1; continue; }
        paths.push(p);
    }
    if (!paths.length) throw new Error('no parseable rows');
    return { paths: paths, nw: nw, hasGid: hasGid, skipped: skipped };
}

function tFromName(name) {
    const m = /_T(\d+)[_.]/.exec(name);
    return m ? parseInt(m[1], 10) : null;
}

function applyImportedDump(parsed, T) {
    genEpoch++;                                      // kill any in-flight generation
    abort_gen = true;
    gridByT = [];                                    // rebuilt lazily by "+ Subs"
    time_steps = T;
    modulation_Max = Math.max(2, time_steps - 1);
    document.getElementById('timeInput').value = T;
    bakeZValues();
    functions = [];
    groupIDcount = 0; subCount = 0;
    for (let i = 0; i < parsed.paths.length; i++) {
        const p = parsed.paths[i];
        const f = {
            ax2: p.ax2, ay2: p.ay2, aw2: p.aw2, terms: p.terms,
            groupID: p.gid,
            // a unique's gid equals its own row index (engine dump contract)
            isSub: parsed.hasGid ? (p.gid !== i) : false,
        };
        f.fsum = freqSum(f.terms);
        const traj = comovingTraj(f);
        f.pecMin = traj.pecMin; f.pecMax = traj.pecMax;
        f.pecPMin = traj.pecPMin; f.pecPMax = traj.pecPMax;
        if (f.isSub) subCount++; else groupIDcount++;
        functions.push(f);
    }
    framePos = (Z_cache.length - 1) / 2;
    buildBuffers(); rebuildGPU();
    hudDirty = true;
    updateHud();
}

function importText(text, filename) {
    let parsed;
    try {
        parsed = parseDumpCSV(text);
    } catch (err) {
        statusEl.textContent = 'Import failed: ' + err.message;
        return;
    }
    let T = tFromName(filename);
    const tWrap = document.getElementById('tWrap');
    if (T === null) {
        tWrap.style.display = 'flex';
        T = parseInt(document.getElementById('tFallbackInput').value, 10) || 40;
        statusEl.textContent = 'No _T<N>_ in the filename — using the T input.';
    } else {
        tWrap.style.display = 'none';
        statusEl.textContent = parsed.skipped ? parsed.skipped + ' unparseable rows skipped' : '';
    }
    applyImportedDump(parsed, T);
    statusEl.textContent = (statusEl.textContent ? statusEl.textContent + ' · ' : '') +
        'imported ' + functions.length + ' paths';
}

/* ---- shared uniforms: one object, referenced by sweep + cloud ---- */
const U = {

    uZ0: { value: 0 }, uStep: { value: 1 }, uT: { value: 1 },   // cloud z reconstruction
    uSize: { value: 2 }, uCloudSize: { value: 0.55 },
    uMode: { value: 2 }, uLog: { value: 1 }, uPecGlobal: { value: 0 },
    uGMin: { value: 1e-3 }, uGMax: { value: 10 },
    uGPMin: { value: 1e-3 }, uGPMax: { value: 10 },
    uFreqMin: { value: 4 }, uFreqMax: { value: 8 },

    uSeedHl: { value: 0 }, uGeoLocal: { value: 1 },

/* ---- term texture + shader source generators ----
   Three texels per term (one per axis): texel 3j+k = (a, b, f, 0) of axis k.
   nw is a compile-time GLSL constant (WebGL1 loop bounds), so materials are
   rebuilt whenever the widest path's term count changes. */
const TERMTEX_W = 2048;
const PAINT_ORDER = ['mono', 'freq', 'pec', 'group', 'role', 'whue', 'pecp'];

function termFetchGLSL(nw) {
    return `
    uniform sampler2D uTerms;
    uniform float uTexH;
    vec4 termTexel(float k) {
        float fi = aIndex * float(${3 * nw}) + k;
        float u = (mod(fi, ${TERMTEX_W}.0) + 0.5) / ${TERMTEX_W}.0;
        float v = (floor(fi / ${TERMTEX_W}.0) + 0.5) / uTexH;
        return texture2D(uTerms, vec2(u, v));
    }`;
}

// sliceMode 1 = present slice (z from uZ); 0 = cloud (z from the vertex's
// time index in position.x, via uZ0/uStep).
function vertSrc(nw, sliceMode) {
    return `
    precision highp float;
    uniform mat4 modelViewMatrix, projectionMatrix;
    attribute vec3 position;
    attribute vec3 aSin1;        // ax2, ay2, aw2
    attribute float aFsum;       // amplitude-weighted mean wiggle frequency
    attribute vec2 aPec;         // per-path comoving speed min, max
    attribute vec2 aPecP;        // per-path PROPER peculiar speed min, max
    attribute float aGroup;      // group ID
    attribute float aIsSub;      // 0 = seed (unique), 1 = subpath
    attribute float aIndex;      // instance index (term-texture row)
    uniform float uZ, uZ0, uStep, uT, uSize, uCloudSize, uGMin, uGMax,
                  uGPMin, uGPMax, uFreqMin, uFreqMax, uOrthoScale,
                  uGhostDim, uGhostDepth;
    uniform int uMode, uLog, uPecGlobal, uSeedHl, uGeoLocal, uIsGhost;
    uniform vec3 uOff, uShift;
    varying vec3 vColor;
    ${termFetchGLSL(nw)}

    vec3 hsv2rgb(float h, float s, float v) {
        vec3 p = abs(fract(h + vec3(0.0, 2.0/3.0, 1.0/3.0)) * 6.0 - 3.0);
        return v * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), s);
    }
    vec3 wrap3(vec3 c) { return fract((c + 1.0) * 0.5) * 2.0 - 1.0; }
    vec3 ramp(float t) {
        t = clamp(t, 0.0, 1.0);
        vec3 c0 = vec3(0.10, 0.18, 0.55), c1 = vec3(0.30, 0.55, 0.95),
             c2 = vec3(0.55, 0.85, 0.75), c3 = vec3(1.0, 0.82, 0.35),
             c4 = vec3(1.0, 0.97, 0.92);
        if (t < 0.35) return mix(c0, c1, t / 0.35);
        if (t < 0.6)  return mix(c1, c2, (t - 0.35) / 0.25);
        if (t < 0.8)  return mix(c2, c3, (t - 0.6) / 0.2);
        return mix(c3, c4, (t - 0.8) / 0.2);
    }
    vec3 hotCold(float t) {
        t = clamp(t, 0.0, 1.0);
        if (t < 0.5) return mix(vec3(1.0, 0.35, 0.25), vec3(1.0), t / 0.5);
        return mix(vec3(1.0), vec3(0.35, 0.55, 1.0), (t - 0.5) / 0.5);
    }

    void main() {
        float z = ${sliceMode === 1 ? 'uZ' : 'uZ0 + position.x * uStep'};
        float s = sin(z);
        float c = cos(z);
        vec3 x = aSin1 * s;
        vec3 dx = aSin1 * c;
        for (int j = 0; j < ${nw}; j++) {
            vec4 tx = termTexel(float(3 * j));
            vec4 ty = termTexel(float(3 * j + 1));
            vec4 tw = termTexel(float(3 * j + 2));
            x.x  += tx.x * (sin(tx.y * z + tx.z) - sin(tx.z));
            x.y  += ty.x * (sin(ty.y * z + ty.z) - sin(ty.z));
            x.z  += tw.x * (sin(tw.y * z + tw.z) - sin(tw.z));
            dx.x += tx.x * tx.y * cos(tx.y * z + tx.z);
            dx.y += ty.x * ty.y * cos(ty.y * z + ty.z);
            dx.z += tw.x * tw.y * cos(tw.y * z + tw.z);
        }
        vec3 X = x / s;
        vec3 dX = (dx * s - x * c) / (s * s);
        // uShift places this pass's periodic image (0 for the main cell;
        // ghost passes use the 26 neighbour offsets in {-2, 0, 2}^3).
        // Pw is the in-cell position — colors come from it so an image
        // keeps its source point's paint.
        vec3 Pw = wrap3(X + uOff);
        vec3 P = Pw + uShift;
        float ghostFog = 1.0;
        if (uIsGhost == 1) {
            // fog band: keep only the sliver within uGhostDepth of the seam,
            // fading to nothing across it — the wraparound as a soft halo
            float over = max(max(abs(P.x), abs(P.y)), abs(P.z)) - 1.0;
            if (over > uGhostDepth) {
                gl_Position = vec4(0.0, 0.0, -1e5, 1.0);
                gl_PointSize = 0.0;
                vColor = vec3(0.0);
                return;
            }
            ghostFog = uGhostDim * (1.0 - smoothstep(0.0, uGhostDepth, over));
        }
        if (uGeoLocal == 0) P *= s;                  // global (raw) geometry

        float v = max(max(abs(dX.x), abs(dX.y)), abs(dX.z));   // Chebyshev speed
        if (uMode == 0) {
            vColor = vec3(0.65, 0.78, 1.0);
        } else if (uMode == 1) {
            float t = (aFsum - uFreqMin) / max(uFreqMax - uFreqMin, 1e-6);
            if (uLog == 1)
                t = log(1.0 + 9.0 * clamp(t, 0.0, 1.0)) / log(10.0);
            vColor = hotCold(t);
        } else if (uMode == 2) {
            float lo = uPecGlobal == 1 ? uGMin : aPec.x;
            float hi = uPecGlobal == 1 ? uGMax : aPec.y;
            float t;
            if (uLog == 1)
                t = (log(max(v, 1e-6)) - log(max(lo, 1e-6))) /
                    max(log(max(hi, 1e-5)) - log(max(lo, 1e-6)), 1e-6);
            else
                t = (v - lo) / max(hi - lo, 1e-6);
            vColor = ramp(t);
        } else if (uMode == 3) {
            vColor = hsv2rgb(fract(aGroup * 0.6180339887), 0.8, 1.0);
        } else if (uMode == 4) {
            vColor = aIsSub > 0.5 ? vec3(1.0, 0.62, 0.3) : vec3(0.45, 0.7, 1.0);
        } else if (uMode == 5) {
            vColor = hsv2rgb((Pw.z + 1.0) * 0.5 * 0.83, 0.85, 1.0);
        } else {
            // proper peculiar speed: the comoving speed carried back to
            // physical units by the scale factor sin z
            float vp = v * s;
            float lo = uPecGlobal == 1 ? uGPMin : aPecP.x;
            float hi = uPecGlobal == 1 ? uGPMax : aPecP.y;
            float t;
            if (uLog == 1)
                t = (log(max(vp, 1e-6)) - log(max(lo, 1e-6))) /
                    max(log(max(hi, 1e-5)) - log(max(lo, 1e-6)), 1e-6);
            else
                t = (vp - lo) / max(hi - lo, 1e-6);
            vColor = ramp(t);
        }

        float sz = ${sliceMode === 1 ? 'uSize * 1.7' : 'uCloudSize'};
        if (uSeedHl == 1) {
            if (aIsSub > 0.5) { sz *= 0.8; vColor *= 0.45; }
            else { sz *= 1.6; vColor *= 1.15; }
        }
        vColor *= ghostFog;                          // 1.0 on the main cell
        vec4 mv = modelViewMatrix * vec4(P, 1.0);
        gl_Position = projectionMatrix * mv;
        float base = uOrthoScale > 0.0 ? uOrthoScale : 8.0 / max(-mv.z, 0.1);
        gl_PointSize = clamp(sz * base, 0.5, 60.0);
    }`;
}

    }`;

/* ---- buffers + GPU objects ---- */
let sweep = null, cloud = null, sweepMat = null, cloudMat = null, matNW = -1;
let termTex = null;
let instSin1, instFsum, instPec, instPecP, instGroup, instSub, instIndex;
let showSweep = true, showCloud = false;

function buildMaterials(nw) {
    if (sweepMat) sweepMat.dispose();
    if (cloudMat) cloudMat.dispose();
    sweepMat = new THREE.RawShaderMaterial({
        uniforms: U,
        vertexShader: vertSrc(nw, 1),
        fragmentShader: FRAG_SRC,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    cloudMat = new THREE.RawShaderMaterial({
        uniforms: U,
        vertexShader: vertSrc(nw, 0),
        fragmentShader: FRAG_SRC,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    matNW = nw;
}

function buildBuffers() {
    const N = functions.length;
    if (!N) return;
    let nw = 1;
    for (let p = 0; p < N; p++)
        if (functions[p].terms.length > nw) nw = functions[p].terms.length;
    if (nw !== matNW) buildMaterials(nw);

    instSin1 = new Float32Array(N * 3);
    instFsum = new Float32Array(N);
    instPec = new Float32Array(N * 2);
    instPecP = new Float32Array(N * 2);
    instGroup = new Float32Array(N);
    instSub = new Float32Array(N);
    instIndex = new Float32Array(N);
    const tpi = 3 * nw;
    const texH = Math.max(1, Math.ceil(N * tpi / TERMTEX_W));
    const tdata = new Float32Array(TERMTEX_W * texH * 4);
    let gmn = Infinity, gmx = -Infinity, fmn = Infinity, fmx = -Infinity;
    let gpmn = Infinity, gpmx = -Infinity;
    for (let p = 0; p < N; p++) {
        const f = functions[p];
        instSin1[p * 3] = f.ax2; instSin1[p * 3 + 1] = f.ay2; instSin1[p * 3 + 2] = f.aw2;
        instFsum[p] = f.fsum;
        instGroup[p] = f.groupID;
        instSub[p] = f.isSub ? 1 : 0;
        instIndex[p] = p;
        instPec[p * 2] = f.pecMin; instPec[p * 2 + 1] = f.pecMax;
        instPecP[p * 2] = f.pecPMin; instPecP[p * 2 + 1] = f.pecPMax;
        if (f.pecMin < gmn) gmn = f.pecMin;
        if (f.pecMax > gmx) gmx = f.pecMax;
        if (f.pecPMin < gpmn) gpmn = f.pecPMin;
        if (f.pecPMax > gpmx) gpmx = f.pecPMax;
        if (f.fsum < fmn) fmn = f.fsum;
        if (f.fsum > fmx) fmx = f.fsum;
        for (let j = 0; j < f.terms.length; j++) {
            const t = f.terms[j], base = (p * tpi + 3 * j) * 4;
            tdata[base]     = t.ax; tdata[base + 1] = t.bx; tdata[base + 2]  = t.fx;
            tdata[base + 4] = t.ay; tdata[base + 5] = t.by; tdata[base + 6]  = t.fy;
            tdata[base + 8] = t.aw; tdata[base + 9] = t.bw; tdata[base + 10] = t.fw;
        }
    }
    if (termTex) termTex.dispose();
    termTex = new THREE.DataTexture(tdata, TERMTEX_W, texH, THREE.RGBAFormat, THREE.FloatType);
    termTex.magFilter = termTex.minFilter = THREE.NearestFilter;
    termTex.wrapS = termTex.wrapT = THREE.ClampToEdgeWrapping;
    termTex.needsUpdate = true;
    U.uTerms.value = termTex;
    U.uTexH.value = texH;
    U.uGMin.value = Math.max(gmn, 1e-6);
    U.uGMax.value = Math.max(gmx, 1e-5);
    U.uGPMin.value = Math.max(gpmn, 1e-6);
    U.uGPMax.value = Math.max(gpmx, 1e-5);
    U.uFreqMin.value = fmn;
    U.uFreqMax.value = Math.max(fmx, fmn + 1e-6);
    const n = Z_cache.length;
    U.uZ0.value = Z_cache[0];
    U.uStep.value = n > 1 ? (Z_cache[n - 1] - Z_cache[0]) / (n - 1) : 1;
    U.uT.value = n;
}

// Cloud base geometry: strided time indices, capped at Cloud res samples/path.
function cloudSamples(n) {
    const cap = Math.max(2, parseInt(document.getElementById('cloudResInput').value, 10) || 48);
    const stride = Math.max(1, Math.ceil(n / cap));
    const count = Math.ceil(n / stride);
    return { stride: stride, count: count };
}

function addInstanced(geo, N) {
    geo.setAttribute('aSin1', new THREE.InstancedBufferAttribute(instSin1, 3));
    geo.setAttribute('aFsum', new THREE.InstancedBufferAttribute(instFsum, 1));
    geo.setAttribute('aPec', new THREE.InstancedBufferAttribute(instPec, 2));
    geo.setAttribute('aPecP', new THREE.InstancedBufferAttribute(instPecP, 2));
    geo.setAttribute('aGroup', new THREE.InstancedBufferAttribute(instGroup, 1));
    geo.setAttribute('aIsSub', new THREE.InstancedBufferAttribute(instSub, 1));
    geo.setAttribute('aIndex', new THREE.InstancedBufferAttribute(instIndex, 1));
    geo.instanceCount = N;
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 6);
}

/* ---- ghost images: fogged periodic neighbours past the wrap seams ----
   The 26 neighbour cells of the 3-torus in {-2,0,2}^3 \ {0}: 6 face images
   (one-axis shifts), 12 edge images (two-axis diagonals), 8 corner images.
   Each ghost is another Points object SHARING the instanced geometry, with
   a material that shares every uniform of U except its own uShift/uIsGhost/
   uGhostDim — same shader source, so the program is compiled once. The
   shader clips each image to a fog band uGhostDepth past its seam and fades
   it to nothing across the band. */
let ghostObjs = [];
let ghostOn = true, ghostReach = 'all', ghostDepth = 0.35, ghostFade = 0.55;
let ghostCloud = false;

function ghostShifts() {
    const out = [];
    for (let sx = -2; sx <= 2; sx += 2)
    for (let sy = -2; sy <= 2; sy += 2)
    for (let sw = -2; sw <= 2; sw += 2) {
        const cls = (sx !== 0) + (sy !== 0) + (sw !== 0);   // 1 face, 2 edge, 3 corner
        if (cls === 0) continue;
        if (ghostReach === 'faces' && cls > 1) continue;
        if (ghostReach === 'edges' && cls > 2) continue;
        out.push({ shift: [sx, sy, sw], cls: cls });
    }
    return out;
}

function disposeGhosts() {
    for (const g of ghostObjs) {
        scene.remove(g.obj);
        g.obj.material.dispose();                    // geometry is shared, keep it
    }
    ghostObjs = [];
}

function ghostMaterial(nw, sliceMode, shift, cls) {
    // deeper image classes fade harder: dim = fade^cls
    const dim = Math.pow(ghostFade, cls);
    return new THREE.RawShaderMaterial({
        uniforms: Object.assign({}, U, {
            uShift: { value: new THREE.Vector3(shift[0], shift[1], shift[2]) },
            uIsGhost: { value: 1 },
            uGhostDim: { value: dim },
        }),
        vertexShader: vertSrc(nw, sliceMode),
        fragmentShader: FRAG_SRC,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
}

function rebuildGhosts() {
    disposeGhosts();
    if (!ghostOn || !functions.length) { updateGhostWire(); return; }
    U.uGhostDepth.value = ghostDepth;
    for (const s of ghostShifts()) {
        if (sweep) {
            const o = new THREE.Points(sweep.geometry, ghostMaterial(matNW, 1, s.shift, s.cls));
            o.frustumCulled = false;
            o.visible = showSweep;
            scene.add(o);
            ghostObjs.push({ obj: o, layer: 'sweep' });
        }
        if (cloud && ghostCloud) {
            const o = new THREE.Points(cloud.geometry, ghostMaterial(matNW, 0, s.shift, s.cls));
            o.frustumCulled = false;
            o.visible = showCloud;
            scene.add(o);
            ghostObjs.push({ obj: o, layer: 'cloud' });
        }
    }
    updateGhostWire();
}
function setGhostVisibility() {
    for (const g of ghostObjs)
        g.obj.visible = g.layer === 'sweep' ? showSweep : showCloud;
}

function rebuildGPU() {
    const N = functions.length;
    if (!N) return;
    if (sweep) { scene.remove(sweep); sweep.geometry.dispose(); }
    if (cloud) { scene.remove(cloud); cloud.geometry.dispose(); }

    const gs = new THREE.InstancedBufferGeometry();
    gs.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3));
    addInstanced(gs, N);
    sweep = new THREE.Points(gs, sweepMat);
    sweep.frustumCulled = false;
    sweep.visible = showSweep;
    scene.add(sweep);

    const n = Z_cache.length;
    const cs = cloudSamples(n);
    const cpos = new Float32Array(cs.count * 3);
    for (let k = 0; k < cs.count; k++) cpos[k * 3] = Math.min(k * cs.stride, n - 1);
    const gc = new THREE.InstancedBufferGeometry();
    gc.setAttribute('position', new THREE.BufferAttribute(cpos, 3));
    addInstanced(gc, N);
    cloud = new THREE.Points(gc, cloudMat);
    cloud.frustumCulled = false;
    cloud.visible = showCloud;
    scene.add(cloud);

    rebuildGhosts();
}

let timeMin = 0, timeMax = Math.PI;
let hudDirty = true;

function zAt(pos) {
    const n = Z_cache.length;
    if (n < 2) return Math.PI / 2;
    const eps = 1e-4;
    let z = Math.max(timeMin + pos * ((timeMax - timeMin) / (n - 1)), eps);
    const k = Math.round(z / Math.PI);
    if (k > 0 && Math.abs(z - k * Math.PI) < eps) z = k * Math.PI - eps;
    return z;
}

const speedRange = document.getElementById('speedRange');

const speedMaxInput = document.getElementById('speedMaxInput');
let speedMin = 0.05, speedMax = 5, speedLogScale = false;
function speedFromPos(p) {
    return speedLogScale ? speedMin * Math.pow(speedMax / speedMin, p)
                         : speedMin + p * (speedMax - speedMin);
}
function posFromSpeed(v) {
    return speedLogScale ? Math.log(v / speedMin) / Math.log(speedMax / speedMin)
                         : (v - speedMin) / (speedMax - speedMin);
}
function showSpeed() {
    speedValEl.textContent = playSpeed.toFixed(2).replace(/0$/, '') + '×';
}
function applySpeedBounds() {
    speedMin = Math.max(0.001, parseFloat(speedMinInput.value) || 0.05);
    speedMax = Math.max(speedMin * 1.01, parseFloat(speedMaxInput.value) || 5);
    speedMinInput.value = speedMin; speedMaxInput.value = speedMax;
    playSpeed = Math.min(Math.max(playSpeed, speedMin), speedMax);
    speedRange.value = posFromSpeed(playSpeed).toFixed(3);
    showSpeed();
}
speedRange.addEventListener('input', function (e) {
    playSpeed = speedFromPos(parseFloat(e.target.value));
    showSpeed();
});

/* ================= minimap: three orthogonal projections ================= */

const miniDPR = Math.min(2, window.devicePixelRatio || 1);
const miniPanels = [
    { canvas: document.getElementById('miniXY'), ax: 0, ay: 1 },
    { canvas: document.getElementById('miniXW'), ax: 0, ay: 2 },
    { canvas: document.getElementById('miniYW'), ax: 1, ay: 2 },
];
for (const p of miniPanels) {
    p.canvas.width = 170 * miniDPR;
    p.canvas.height = 170 * miniDPR;
    p.ctx = p.canvas.getContext('2d');
}

// CPU twins of the shader color modes (minimap must match the GPU exactly).
function cpuRamp(t) {
    t = Math.min(Math.max(t, 0), 1);
    const stops = [
        [0.10, 0.18, 0.55], [0.30, 0.55, 0.95], [0.55, 0.85, 0.75],
        [1.0, 0.82, 0.35], [1.0, 0.97, 0.92],
    ];
    const cuts = [0, 0.35, 0.6, 0.8, 1.0001];
    for (let k = 1; k < cuts.length; k++) {
        if (t < cuts[k]) {
            const u = (t - cuts[k - 1]) / (cuts[k] - cuts[k - 1]);
            return stops[k - 1].map(function (a, i) { return a + (stops[k][i] - a) * u; });
        }
    }
    return stops[4];
}
function cpuHotCold(t) {
    t = Math.min(Math.max(t, 0), 1);
    if (t < 0.5) {
        const u = t / 0.5;
        return [1, 0.35 + 0.65 * u, 0.25 + 0.75 * u];
    }
    const u = (t - 0.5) / 0.5;
    return [1 - 0.65 * u, 1 - 0.45 * u, 1];
}
function cpuHsv(h, s, v) {
    const rgb = [];
    for (const o of [0, 2 / 3, 1 / 3]) {
        const p = Math.abs(((h + o) % 1) * 6 - 3);
        rgb.push(v * (1 + s * (Math.min(Math.max(p - 1, 0), 1) - 1)));
    }
    return rgb;
}
function sliceColor(f, pos, vel, s) {
    const mode = U.uMode.value;
    if (mode === 6) {
        // proper peculiar speed: comoving Chebyshev speed × scale factor
        const vp = Math.max(Math.abs(vel[0]), Math.abs(vel[1]), Math.abs(vel[2])) * s;
        const lo = U.uPecGlobal.value === 1 ? U.uGPMin.value : f.pecPMin;
        const hi = U.uPecGlobal.value === 1 ? U.uGPMax.value : f.pecPMax;
        let t;
        if (U.uLog.value === 1)
            t = (Math.log(Math.max(vp, 1e-6)) - Math.log(Math.max(lo, 1e-6))) /
                Math.max(Math.log(Math.max(hi, 1e-5)) - Math.log(Math.max(lo, 1e-6)), 1e-6);
        else
            t = (vp - lo) / Math.max(hi - lo, 1e-6);
        return cpuRamp(t);
    }
    if (mode === 0) return [0.65, 0.78, 1.0];
    if (mode === 1) {
        let t = (f.fsum - U.uFreqMin.value) /
            Math.max(U.uFreqMax.value - U.uFreqMin.value, 1e-6);
        if (U.uLog.value === 1) t = Math.log(1 + 9 * Math.min(Math.max(t, 0), 1)) / Math.log(10);
        return cpuHotCold(t);
    }
    if (mode === 2) {
        const v = Math.max(Math.abs(vel[0]), Math.abs(vel[1]), Math.abs(vel[2]));
        const lo = U.uPecGlobal.value === 1 ? U.uGMin.value : f.pecMin;
        const hi = U.uPecGlobal.value === 1 ? U.uGMax.value : f.pecMax;
        let t;
        if (U.uLog.value === 1)
            t = (Math.log(Math.max(v, 1e-6)) - Math.log(Math.max(lo, 1e-6))) /
                Math.max(Math.log(Math.max(hi, 1e-5)) - Math.log(Math.max(lo, 1e-6)), 1e-6);
        else
            t = (v - lo) / Math.max(hi - lo, 1e-6);
        return cpuRamp(t);
    }
    if (mode === 3) return cpuHsv((f.groupID * 0.6180339887) % 1, 0.8, 1);
    if (mode === 4) return f.isSub ? [1.0, 0.62, 0.3] : [0.45, 0.7, 1.0];
    return cpuHsv((pos[2] + 1) * 0.5 * 0.83, 0.85, 1);
}

function drawMini() {
    if (!functions.length || !Z_cache.length) return;
    const z = zAt(framePos);
    const s = Math.sin(z);
    const geoLocal = U.uGeoLocal.value === 1;
    const seedHl = U.uSeedHl.value === 1;
    const size = 3 * miniDPR;
    // with ghosts on, panels show the fog band too: the chart spans
    // [-(1+depth), 1+depth] with the main cell outlined
    const half = ghostOn ? 1 + ghostDepth : 1;
    const shifts2 = [];
    if (ghostOn) {
        for (let a = -2; a <= 2; a += 2)
            for (let b = -2; b <= 2; b += 2)
                if (a !== 0 || b !== 0) shifts2.push([a, b]);
    }
    for (const p of miniPanels) p.ctx.clearRect(0, 0, p.canvas.width, p.canvas.height);
    for (const f of functions) {
        const raw = comovXYW(f, z);
        const needVel = U.uMode.value === 2 || U.uMode.value === 6;
        const vel = needVel ? comovVelXYW(f, z) : [0, 0, 0];
        const pos = [
            wrapComov(raw[0] + off.x),
            wrapComov(raw[1] + off.y),
            wrapComov(raw[2] + off.w),
        ];
        const draw = geoLocal ? pos : pos.map(function (c) { return c * s; });
        const col = sliceColor(f, pos, vel, s);
        let alpha = 0.55, sz = size;
        if (seedHl) {
            if (f.isSub) { alpha = 0.25; sz = size * 0.8; }
            else { alpha = 0.9; sz = size * 1.5; }
        }
        const rgb = Math.round(col[0] * 255) + ',' + Math.round(col[1] * 255) +
            ',' + Math.round(col[2] * 255);
        for (const p of miniPanels) {
            const u = draw[p.ax], v = draw[p.ay];
            const toPx = function (c) { return (c / half + 1) * 0.5 * p.canvas.width; };
            const toPy = function (c) { return (1 - (c / half + 1) * 0.5) * p.canvas.height; };
            p.ctx.fillStyle = 'rgba(' + rgb + ',' + alpha + ')';
            p.ctx.fillRect(toPx(u) - sz / 2, toPy(v) - sz / 2, sz, sz);
            // fogged periodic images of this point in the panel plane
            for (const sh of shifts2) {
                const gu = u + sh[0], gv = v + sh[1];
                const over = Math.max(Math.abs(gu), Math.abs(gv)) - 1;
                if (over > ghostDepth) continue;
                const fog = ghostFade * (1 - over / ghostDepth);
                p.ctx.fillStyle = 'rgba(' + rgb + ',' + (alpha * fog).toFixed(3) + ')';
                p.ctx.fillRect(toPx(gu) - sz / 2, toPy(gv) - sz / 2, sz, sz);
            }
        }
    }
    if (ghostOn) {
        // outline the main cell so the fog band reads as "outside"
        for (const p of miniPanels) {
            const w = p.canvas.width, x0 = (1 - 1 / half) * 0.5 * w, x1 = w - 2 * x0;
            p.ctx.strokeStyle = 'rgba(90, 111, 174, 0.5)';
            p.ctx.lineWidth = miniDPR;
            p.ctx.strokeRect(x0, x0, x1, x1);
        }
    }
    document.getElementById('miniBar').textContent =
        (geoLocal ? 'local (comoving)' : 'global (raw)') +
        ' · t = ' + (z / Math.PI).toFixed(3) + 'π · a = ' + s.toFixed(3);
}

/* ================= HUD ================= */

function updateHud() {
    const hud = document.getElementById('hud');
    if (!functions.length) {
        hud.textContent = 'no data — Generate, Import CSV or Example';
        return;
    }
    const countTxt = subCount
        ? groupIDcount + ' uniques + ' + subCount + ' subpaths'
        : functions.length + ' paths';
    hud.textContent = countTxt + '  ·  T=' + time_steps + '  ·  z=' +
        (zAt(framePos) / Math.PI).toFixed(3) + 'π';
}

/* ================= export: WebM / PNG of the main canvas ================= */

const EXPORT_DPR = 1;                                // main canvas is already DPR-scaled
let exportState = null;
function compositeCanvas() {
    const src = renderer.domElement;
    const c = document.createElement('canvas');
    c.width = src.width * EXPORT_DPR;
    c.height = src.height * EXPORT_DPR + 30;
    return c;
}
function drawComposite(ctx, comp, label) {
    const src = renderer.domElement;
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, comp.width, comp.height);
    ctx.drawImage(src, 0, 0, comp.width, comp.height - 30);
    ctx.fillStyle = '#9fb2d8';
    ctx.font = '14px sans-serif';
    ctx.fillText(label, 10, comp.height - 10);
    ctx.textAlign = 'right';
    ctx.fillText(VIEWER_VERSION, comp.width - 10, comp.height - 10);
    ctx.textAlign = 'left';
}
function downloadBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
}
function renderOnce() {
    U.uZ.value = zAt(framePos);
    if (camera.isOrthographicCamera) U.uOrthoScale.value = 9.0 * camera.zoom;
    else U.uOrthoScale.value = 0;
    renderer.render(scene, camera);
}
document.getElementById('expPngBtn').addEventListener('click', function () {
    if (!functions.length) { statusEl.textContent = 'Nothing to snapshot yet'; return; }
    const comp = compositeCanvas();
    renderOnce();
    drawComposite(comp.getContext('2d'), comp,
        't = ' + (zAt(framePos) / Math.PI).toFixed(3) + 'π · ' + functions.length + ' paths');
    comp.toBlob(function (blob) {
        if (blob) downloadBlob(blob, 'box3d_T' + time_steps + '.png');
    });
});
document.getElementById('expWebmBtn').addEventListener('click', function () {
    if (exportState) {                               // the button doubles as Cancel
        exportState.cancelled = true;
        clearInterval(exportState.interval);
        if (exportState.recorder.state !== 'inactive') exportState.recorder.stop();
        return;
    }
    if (!functions.length) { statusEl.textContent = 'Nothing to record yet'; return; }
    if (!window.MediaRecorder) {
        statusEl.textContent = 'This browser has no MediaRecorder — video export unavailable';
        return;
    }
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4']
        .find(function (m) { return MediaRecorder.isTypeSupported(m); });
    if (!mime) {
        statusEl.textContent = 'No supported video format for MediaRecorder';
        return;
    }
    const fps = Math.min(60, Math.max(1, parseInt(document.getElementById('expFpsInput').value, 10) || 30));
    const secs = Math.min(60, Math.max(1, parseInt(document.getElementById('expSecsInput').value, 10) || 8));
    const F = fps * secs;
    const comp = compositeCanvas();
    const ctx = comp.getContext('2d');
    // frame-accurate where possible: a zero-fps stream only emits a frame
    // when requestFrame() is called, one per drawn export frame
    let stream = comp.captureStream(0);
    let track = stream.getVideoTracks()[0];
    const canReq = track && typeof track.requestFrame === 'function';
    if (!canReq) { stream = comp.captureStream(fps); track = null; }
    const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8e6 });
    const chunks = [];
    recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    const btn = document.getElementById('expWebmBtn');
    const savedPos = framePos, savedPlaying = playing;
    playing = false;
    recorder.onstop = function () {
        const ex = exportState;
        exportState = null;
        btn.textContent = '⬇ WebM';
        btn.classList.remove('on');
        framePos = savedPos; playing = savedPlaying;
        if (!ex || ex.cancelled) { statusEl.textContent = 'Export cancelled'; return; }
        const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        downloadBlob(new Blob(chunks, { type: mime }), 'box3d_T' + time_steps + '_' + F + 'f.' + ext);
        statusEl.textContent = 'Exported ' + F + ' frames at ' + fps + ' fps (' + ext + ')';
    };
    const drawFrame = function (k) {
        framePos = (k / Math.max(F - 1, 1)) * (Z_cache.length - 1);
        renderOnce();
        drawComposite(ctx, comp,
            't = ' + (zAt(framePos) / Math.PI).toFixed(3) + 'π · ' + (k + 1) + '/' + F);
        if (track) track.requestFrame();
    };
    drawFrame(0);                                    // frame 0 is never blank
    recorder.start();
    let k = 1;
    const interval = setInterval(function () {
        if (k >= F) {
            clearInterval(interval);
            recorder.stop();
            return;
        }
        drawFrame(k);
        statusEl.textContent = 'Exporting… ' + (k + 1) + '/' + F;
        k++;
    }, 1000 / fps);
    exportState = { recorder: recorder, interval: interval, cancelled: false };
    btn.textContent = 'Cancel';
    btn.classList.add('on');
    statusEl.textContent = 'Exporting… 1/' + F + ' (' + secs + 's of video)';
});

/* ================= render loop ================= */

let lastFrame = performance.now();
function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min((now - lastFrame) / 1000, 0.1);
    lastFrame = now;
    const dtNorm = dt * 60;                          // 60 Hz-normalized frames
    if (playing && Z_cache.length > 1 && !exportState) {
        framePos = (framePos + playSpeed * dtNorm) % (Z_cache.length - 1);
        timeScrub.value = (framePos / (Z_cache.length - 1)).toFixed(4);
        updateHud();
    }
    for (const axis of ['x', 'y', 'w']) {
        if (drift[axis].chk.checked) {
            applyOffset(axis, off[axis] + parseFloat(drift[axis].spd.value) * dt);
        }
    }
    if (!exportState) renderOnce();
    controls.update();
    const miniOn = document.getElementById('miniChk').checked;
    if (miniOn && functions.length && (playing || hudDirty)) {
        drawMini();
        hudDirty = false;
    }
}
requestAnimationFrame(tick);

/* auto-generate a small pack on load, like the 2+1 viewer */
setTimeout(function () { document.getElementById('generateBtn').click(); }, 60);
</script>
</body>
